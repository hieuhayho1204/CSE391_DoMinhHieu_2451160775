<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Transitions & Animations - Bài B2</title>
  <link rel="stylesheet" href="animations.css">
</head>
<body>

  <div class="animation-container fade-in-element">
    <h1>🎯 Bài B2: CSS Transitions & Animations</h1>
    <p class="subtitle">Trang web này thể hiện 5 hiệu ứng chuyển động bắt buộc bằng CSS thuần.</p>

    <div class="product-card">
      <div class="card-img-container">
        <img src="https://picsum.photos/400/300?random=10" alt="Ảnh sản phẩm zoom">
      </div>
      
      <div class="card-info">
        <h4>Sản phẩm chuyển động Premium</h4>
        <p class="desc">Rê chuột (hover) vào thẻ này để thấy hiệu ứng dịch chuyển đổ bóng và phóng to hình ảnh mượt mà.</p>
        
        <button class="btn-buy">Mua ngay</button>
      </div>
    </div>

    <div class="spinner-section">
      <h3>4. Loading Spinner (Xoay vô hạn)</h3>
      <div class="spinner"></div>
    </div>
  </div>

</body>
</html>
